<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wordbreak v0.2</title>
<meta name="description" content="English spelling isn't phonetic — it's legacy code. Wordbreak teaches you to read the source: flag the byte you don't trust, then pull the rule behind it.">
<meta name="theme-color" content="#0e1116">
<meta name="color-scheme" content="dark">

<!-- icons -->
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">

<!-- open graph -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Wordbreak">
<meta property="og:title" content="Wordbreak — english is legacy code">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Wordbreak — english is legacy code">
<meta name="twitter:description" content="A spelling game for strong readers who spell like the codebase is broken. Flag the byte you don't trust, then pull the rule that explains it.">
<meta name="twitter:image" content="https://wordbreak.fun/og.png">
<style>
  :root{
    --bg:#0e1116; --panel:#151a21; --panel2:#111620; --line:#242c37;
    --text:#c8d3de; --dim:#66738a; --amber:#e0af68; --cyan:#6cb6c9;
    --green:#9ecc6f; --red:#e06c75; --violet:#c3a6ff;
    --mono:ui-monospace,'Cascadia Code','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--text);font-family:var(--mono);font-size:15px;line-height:1.65}
  body{display:flex;justify-content:center;min-height:100vh}
  #app{width:100%;max-width:860px;padding:20px 18px 80px}
  .titlebar{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:8px;
    background:var(--panel);padding:9px 14px;margin-bottom:22px;font-size:13px;color:var(--dim)}
  .titlebar .dots{display:flex;gap:6px}
  .titlebar .dot{width:10px;height:10px;border-radius:50%;background:var(--line)}
  .titlebar .path{margin-left:auto;letter-spacing:.04em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:55%}
  .titlebar .path b{color:var(--amber);font-weight:600}
  h1.big{font-size:26px;letter-spacing:.14em;font-weight:700;margin-bottom:2px}
  h1.big .cursor{display:inline-block;width:12px;height:22px;background:var(--amber);margin-left:6px;
    animation:blink 1.1s steps(1) infinite;vertical-align:-2px}
  @keyframes blink{50%{opacity:0}}
  @media (prefers-reduced-motion: reduce){ .cursor{animation:none} *{transition:none!important} }
  .sub{color:var(--dim);font-size:13px;margin-bottom:20px}
  .banner{border:1px solid #5c4c2a;border-radius:8px;background:#1a1712;color:var(--amber);
    font-size:13px;padding:12px 16px;margin-bottom:20px}
  .banner b{font-weight:600}
  .card{border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:18px 20px;margin-bottom:16px}
  .card.quiet{background:var(--panel2)}
  .eyebrow{font-size:11px;letter-spacing:.22em;color:var(--dim);text-transform:uppercase;margin-bottom:10px}
  .eyebrow .n{color:var(--amber)}
  .stagehead{display:flex;align-items:baseline;gap:12px;cursor:pointer;user-select:none}
  .stagehead .sn{color:var(--amber);font-weight:700;font-size:13px;letter-spacing:.14em}
  .stagehead .st{font-weight:700;font-size:16px}
  .stagehead .sd{color:var(--dim);font-size:12px;flex:1;min-width:120px}
  .stagehead .tog{color:var(--dim);font-size:12px}
  .modrow{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px dashed var(--line);flex-wrap:wrap}
  .modrow:last-child{border-bottom:none}
  .modname{color:var(--cyan);font-weight:600;min-width:150px;font-size:14px}
  .modname .uid{color:var(--dim);font-weight:400;font-size:11px;margin-right:6px}
  .moddesc{color:var(--dim);font-size:12px;flex:1;min-width:150px}
  .status{font-size:10px;letter-spacing:.1em;padding:2px 8px;border-radius:4px;border:1px solid var(--line);color:var(--dim)}
  .status.done{color:var(--green);border-color:#3a4a33}
  button{font-family:var(--mono);font-size:14px;color:var(--text);background:#1b222c;border:1px solid var(--line);
    border-radius:6px;padding:8px 16px;cursor:pointer;transition:border-color .12s, background .12s}
  button:hover{border-color:var(--amber)}
  button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
  button:disabled{opacity:.35;cursor:not-allowed}
  button:disabled:hover{border-color:var(--line)}
  button.primary{border-color:var(--amber);color:var(--amber);font-weight:600}
  button.primary:hover{background:#241f14}
  button.ghost{background:transparent;color:var(--dim);border-color:transparent;padding:8px 8px}
  button.ghost:hover{color:var(--text)}
  button.small{font-size:12px;padding:5px 12px}
  button.choice{margin:4px 6px 4px 0}
  button.choice.picked-right{border-color:var(--green);color:var(--green)}
  button.choice.picked-wrong{border-color:var(--red);color:var(--red)}
  button.lineup{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 16px;font-size:15px}
  button.lineup .tag{float:right;font-size:11px;letter-spacing:.1em;color:var(--dim)}
  button.lineup.spent{opacity:.45;cursor:default}
  button.lineup.spent:hover{border-color:var(--line)}
  button.lineup.hit{border-color:var(--violet);color:var(--violet);opacity:1}
  input[type=text]{font-family:var(--mono);font-size:20px;letter-spacing:.18em;color:var(--text);
    background:#0b0e13;border:1px solid var(--line);border-radius:6px;padding:10px 14px;width:100%;max-width:440px}
  input[type=text]:focus{outline:none;border-color:var(--amber)}
  .inputrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
  .bytes{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0 4px}
  .byte{position:relative;display:flex;flex-direction:column;align-items:center;cursor:pointer;border:1px solid var(--line);
    border-radius:6px;background:#0b0e13;padding:8px 0 4px;width:42px;user-select:none;transition:border-color .1s, transform .06s;
    font-family:inherit;color:inherit}
  button.byte{appearance:none;-webkit-appearance:none}
  .byte .ch{font-size:21px;font-weight:600;line-height:1.1}
  .byte .ix{font-size:10px;color:var(--dim);margin-top:3px}
  .byte:hover{border-color:var(--amber)}
  .byte.flagged{border-color:var(--amber);background:#241f14;transform:translateY(-3px)}
  .byte.flagged::after{content:"▲ FLAG";position:absolute;top:-19px;left:50%;transform:translateX(-50%);
    font-size:9px;letter-spacing:.14em;color:var(--amber);white-space:nowrap}
  .byte.static{cursor:default}
  .byte.static:hover{border-color:var(--line)}
  .byte.hot{border-color:var(--green);background:#141b10}
  .byte.hot .ch{color:var(--green)}
  .byte.dark{border-color:#5c3535;background:#1a1113}
  .byte.dark .ch{color:var(--red)}
  .flaghint{font-size:12px;color:var(--dim);margin-top:14px}
  .flaghint b{color:var(--amber);font-weight:600}
  .term{border-left:2px solid var(--line);padding:2px 0 2px 14px;margin:14px 0;font-size:14px}
  .term .ln{margin:5px 0}
  .term .ok{color:var(--green)} .term .bad{color:var(--red)} .term .warn{color:var(--amber)}
  .term .info{color:var(--cyan)} .term .wit{color:var(--violet)} .term .dim{color:var(--dim)}
  .verdict{border:1px solid var(--line);border-radius:6px;padding:12px 16px;margin:14px 0;font-size:15px}
  .verdict.good{border-color:#3a4a33;color:var(--green)}
  .verdict.flat{border-color:var(--line);color:var(--dim)}
  .verdict.v{border-color:#40345c;color:var(--violet)}
  .verdict.warn{border-color:#5c4c2a;color:var(--amber)}
  .verdict b{font-weight:700}
  .panelstep{font-size:11px;letter-spacing:.2em;color:var(--dim);margin-bottom:8px}
  .panelstep b{color:var(--amber)}
  .brieftitle{font-size:19px;font-weight:700;margin-bottom:12px}
  .brieftitle .arrow{color:var(--dim)}
  .briefbody{font-size:15px}
  .briefbody p{margin:8px 0}
  .briefbody .k{color:var(--amber);font-weight:600}
  .briefbody .g{color:var(--green);font-weight:600}
  .briefbody .r{color:var(--red);font-weight:600}
  .briefbody .c{color:var(--cyan)}
  .briefbody .v{color:var(--violet);font-weight:600}
  .cluetext{color:var(--dim);font-size:14px;margin:4px 0 2px}
  .cluetext b{color:var(--text)}
  /* the build cue — the move, never the answer. reads as the prompt it is:
     indented off a rule like the word-sum prompts in the run loop. */
  .kcue{color:var(--text);font-size:15px;margin:8px 0 10px;padding:8px 0 8px 12px;
        border-left:2px solid var(--amber)}
  .navrow{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap;align-items:center}
  .navrow .spacer{flex:1}
  .wordprompt{font-size:23px;font-weight:700;letter-spacing:.05em;margin:6px 0 2px}
  .wordprompt .sfx{color:var(--amber)}
  .align{margin:14px 0;font-size:15px}
  .align .row{display:flex;align-items:baseline;gap:2px;flex-wrap:wrap;margin:4px 0}
  .align .lbl{width:86px;color:var(--dim);font-size:11px;letter-spacing:.1em}
  .align .seg{padding:1px 2px}
  .align .stress{color:var(--violet);font-weight:700;font-size:18px}
  .progress{font-size:11px;letter-spacing:.16em;color:var(--dim);margin-bottom:14px}
  .progress .lit{color:var(--amber)}
  table.debrief{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
  table.debrief th{color:var(--dim);text-align:left;font-weight:400;letter-spacing:.1em;font-size:11px;
    text-transform:uppercase;padding:6px 8px;border-bottom:1px solid var(--line)}
  table.debrief td{padding:7px 8px;border-bottom:1px dashed var(--line)}
  td.good{color:var(--green)} td.bad{color:var(--red)} td.mid{color:var(--amber)} td.dimc{color:var(--dim)}
  .obs ol{margin:10px 0 0 22px;color:var(--dim);font-size:13px}
  .obs li{margin:8px 0}
  .obs b{color:var(--text);font-weight:600}
  .footer{margin-top:34px;color:#3d4655;font-size:11px;letter-spacing:.1em;text-align:center}
</style>
</head>
<body>
<div id="app"></div>
<!-- WORDBREAK_SCRIPTS -->
</body>
</html>
