<style>
  :root{

  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--text);font-family:var(--mono);font-size:15px;line-height:1.65}
  body{display:flex;justify-content:center;min-height:100vh}
  #app{width:100%;max-width:860px;padding:20px 18px 80px}

    animation:blink 1.1s steps(1) infinite;vertical-align:-2px}

  .sub{color:var(--dim);font-size:13px;margin-bottom:20px}

  .card{border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:18px 20px;margin-bottom:16px}

  .eyebrow{font-size:11px;letter-spacing:.22em;color:var(--dim);text-transform:uppercase;margin-bottom:10px}
  .eyebrow .n{color:var(--amber)}

  .stagehead .tog{color:var(--dim);font-size:12px}

  .panelstep{font-size:11px;letter-spacing:.2em;color:var(--dim);margin-bottom:8px}

  .brieftitle{font-size:19px;font-weight:700;margin-bottom:12px}

  .briefbody .r{color:var(--red);font-weight:600}
  .briefbody .c{color:var(--cyan)}
  .briefbody .v{color:var(--violet);font-weight:600}
  .cluetext{color:var(--dim);font-size:14px;margin:4px 0 2px}
  .cluetext b{color:var(--text)}
  /* the build cue — the move, never the answer. reads as the prompt it is:
     indented off a rule like the word-sum prompts in the run loop. */
  .kcue{color:var(--text);font-size:15px;margin:8px 0 10px;padding:8px 0 8px 12px;
        border-left:2px solid var(--amber)}
  .navrow{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap;align-items:center}
  .navrow .spacer{flex:1}
  .wordprompt{font-size:23px;font-weight:700;letter-spacing:.05em;margin:6px 0 2px}
  .wordprompt .sfx{color:var(--amber)}
  .align{margin:14px 0;font-size:15px}
  .align .row{display:flex;align-items:baseline;gap:2px;flex-wrap:wrap;margin:4px 0}
  .align .lbl{width:86px;color:var(--dim);font-size:11px;letter-spacing:.1em}
  .align .seg{padding:1px 2px}
  .align .stress{color:var(--violet);font-weight:700;font-size:18px}
  .progress{font-size:11px;letter-spacing:.16em;color:var(--dim);margin-bottom:14px}
  .progress .lit{color:var(--amber)}
  table.debrief{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}

  td.good{color:var(--green)} td.bad{color:var(--red)} td.mid{color:var(--amber)} td.dimc{color:var(--dim)}
  .obs ol{margin:10px 0 0 22px;color:var(--dim);font-size:13px}
  .obs li{margin:8px 0}
  .obs b{color:var(--text);font-weight:600}
  .footer{margin-top:34px;color:#3d4655;font-size:11px;letter-spacing:.1em;text-align:center}
</style>

UNITS.push(
{id:"1.1",st:1,err:"E7",nm:"parts.intro",ti:"Words are built of parts",ds:"the reframe everything else stands on",
docs:[
{s:"01 / INTRO",t:"the oldest fossils",b:"<p><span class='k'>house · water · friend · would</span> — the oldest, most-used English words are Anglo-Saxon fossils. and every bigger word? <b>built from parts like these.</b></p>"},
{s:"02 / DEVELOP",t:"sun + set",b:"<p>a word is an <span class='g'>assembly of meaning-parts</span>, not a string of sounds. sun + set = <span class='g'>sunset</span>. every letter of both survives the glue.</p>"},
{s:"03 / THE TWIST",t:"anthill",b:"<p>ant + hill. the middle looks like the sound <span class='r'>‹th›</span> — it isn't. it's a <b>t</b> and an <b>h</b> from two different words, touching at a seam.</p><p class='cluetext'>seams can lie to your eye. read the parts, not the blur.</p>"},
{s:"04 / YOU RUN IT",t:"cat + fish → ?",b:"",q:{p:"how many letters survive the glue?",o:["all of them","some merge"],c:0,fb:"all. always. parts keep every letter."},cue:"cat + fish — glue them, keep every letter",ty:"catfish"}],

{a:"backpack",p:{k:"build",s:"back + pack"},hot:{c:"kp",m:3},fork:{k:"cond",qs:[],vd:"back + pack — nothing merges at the seam: <b>back·pack</b>.",vc:"good"}},
{a:"catfish",p:{k:"build",s:"cat + fish"},hot:{c:"tf",m:2},fork:{k:"cond",qs:[],vd:"cat + fish → <b>cat·fish</b>. two parts, all letters.",vc:"good"}},
{a:"anthill",p:{k:"build",s:"ant + hill"},hot:{c:"th",m:2},fork:{k:"cond",qs:[{q:"the ‹t·h› in the middle is…",o:["one sound: th","two words touching"],c:1,why:"ant + hill — the t and h belong to different words."}],vd:"the seam only looks like ‹th›: <b>ant·hill</b>.",vc:"good"}}]},

{id:"1.2",st:1,err:"E3",nm:"flsz.rule",ti:"Short vowels & the FLSZ double",ds:"the oldest doubling rule in English",

{s:"01 / INTRO",t:"off · ball · pass · buzz",b:"<p>one syllable, short vowel, ending in <span class='k'>f, l, s, z</span> → <span class='g'>double it</span>. the oldest doubling rule in the language.</p>"},
{s:"02 / DEVELOP",t:"stiff · spell · glass · fizz",b:"<p>run the checks: one beat? short vowel? ends f/l/s/z? all yes → double. this is your first taste of <b>doubling with a reason</b>.</p>"},

{s:"04 / YOU RUN IT",t:"fizz",b:"",q:{p:"short i, one beat, ends in z — double it?",o:["double","don't"],c:0,fb:"double: fizz."},cue:"the sound soda makes — short vowel, then the FLSZ double",ty:"fizz"}],
words:[
{a:"spell",p:{k:"say",cl:"to write a word out, letter by letter."},hot:{c:"l",m:2},fork:{k:"cond",qs:[{q:"one syllable?",o:["yes","no"],c:0,why:""},{q:"short vowel?",o:["yes","no"],c:0,why:""}],vd:"short e + one beat + ends in l → <b>double: spell</b>.",vc:"good"}},
{a:"glass",p:{k:"say",cl:"sand, melted into windows."},hot:{c:"s",m:3},fork:{k:"cond",qs:[],vd:"short a, one beat, ends in s → <b>glass</b>.",vc:"good"}},

{a:"bus",p:{k:"say",cl:"the big yellow ride to school."},hot:{c:"s",m:2},fork:{k:"cond",qs:[{q:"run the rule — double the s?",o:["double","don't"],c:1,why:"bus is on the refuser list: bus, gas, if, pal."}],vd:"exception. the short list — <b>bus, gas, if, pal</b> — refuses the rule. book them.",vc:"warn"}}]},

{id:"1.3",st:1,err:"E3",nm:"ck.choice",ti:"The ck / k / c decision",ds:"where «picknic» is born — and prevented",
docs:[
{s:"01 / INTRO",t:"back · sick · sock",b:"<p><span class='k'>ck</span> after a short vowel in a <b>one-syllable</b> word. that's its whole territory.</p>"},
{s:"02 / DEVELOP",t:"bank · milk · week",b:"<p>everywhere else: plain <span class='k'>k</span> — after a consonant (mil·k), after a long vowel (wee·k).</p>"},

{id:"1.4",st:1,err:"E6",nm:"silent.e",ti:"The silent-e job",ds:"the e is a worker, not a habit",

{a:"hop",p:{k:"say",cl:"the bunny move."},hot:{c:"p",m:2},fork:{k:"cond",qs:[{q:"vowel long or short?",o:["long","short"],c:1,why:"short o — no job for an e."}],vd:"short vowel → <b>no e</b>: hop. (hope is a different word.)",vc:"warn"}}]},

docs:[
{s:"01 / INTRO",t:"play / paint",b:"<p>same sound, two spellings. the rule is <span class='g'>position</span>: <span class='k'>ay</span> at the end, <span class='k'>ai</span> in the middle.</p>"},
{s:"02 / DEVELOP",t:"boy / boil",b:"<p>same deal: <span class='k'>oy</span> at the end, <span class='k'>oi</span> in the middle.</p>"},

{s:"02 / DEVELOP",t:"why?",b:"<p>English is layered — 1,400 years of merges. some sounds ended up with multiple legal spellings and no referee.</p>"},

  S.log.push({module:S.unit.nm,word:w.a,clean:S.firstClean,aim:S.aimGood,solve:solve,err:w.err});
  const ev={t:Date.now(),unit:S.unit.id,word:w.a,clean:S.firstClean,aim:S.aimGood,solve:solve,err:w.err,
    latency:S.latency,tries:S.patchTries,revealed:S.reveal};
  P.log.push(ev);
  const day=reportTouch(reportDay(ev.t));
  day.practiceEvents++;if(S.firstClean)day.clean++;if(S.aimGood)day.liveAim++;
  if(S.mode==="review"){day.reviewEvents++;if(S.firstClean)day.reviewClean++;if(S.aimGood)day.reviewLiveAim++;}
  if(w.err&&w.err!=="E0"){
    const c=day.codes[w.err]||(day.codes[w.err]={seen:0,clean:0,aim:0});
    c.seen++;if(S.firstClean)c.clean++;if(S.aimGood)c.aim++;
  }
  if(P.log.length>LOG_CAP) P.log=P.log.slice(-LOG_CAP);
  scheduleWord(w,S.firstClean);                         /* set its next return — the widening interval */
  onEncounter(ev);                                      /* feed the measured profile (skips E0 internally) */
  let lastWord=false, fastClear=false;
  if(S.mode!=="review"){
    lastWord=S.wordIdx===S.unit.words.length-1;
    fastClear=S.fastPass&&cleanPath&&S.wordIdx===0;     /* one CLEAN FIRST build clears it; a word-0 fault falls
                                                            back to the full word set (mastery wasn't demonstrated) */
    if(lastWord||fastClear){
      const newlyCleared=!P.cleared[S.unit.id];P.cleared[S.unit.id]=true;
      if(newlyCleared&&!day.modulesCleared.includes(S.unit.id))day.modulesCleared.push(S.unit.id);
      if(fastClear&&!lastWord) S.fastCleared=true;
    }
  }
  /* atomic session advance (decision 11): the cursor moves in the SAME saveP as the ledger
     writes above, so a reload from the done screen resumes at the next block — never replaying
     this word. a rev block is one word (always done here); a mod block is done when it clears. */
  if(S.session&&P.session){

    if(blockDone){

    }

function reportCredit(start,end){
