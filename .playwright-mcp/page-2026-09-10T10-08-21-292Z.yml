      - button "Copy prompt to clipboard" [ref=e64] [cursor=pointer]
    - status [ref=e68]
    - paragraph [ref=e69]: After setup, restart your agent and ask it to use missingmanual to research your question.
    - paragraph [ref=e70]:
      - link "Install for Claude Code, Cursor, Codex, or another Streamable HTTP MCP client" [ref=e71] [cursor=pointer]:
        - /url: /install.md
      - text: .
    - heading "One skill to remember" [level=2] [ref=e72]
    - list [ref=e73]:
      - listitem [ref=e74]:
        - strong [ref=e75]: Ask naturally.
        - text: MissingManual decides whether the question needs a research guide, a paper search, or existing material already in the repository.
      - listitem [ref=e76]:
        - strong [ref=e77]: Get evidence, not a search dump.
        - text: It checks consequential claims, preserves uncertainty, and returns the shortest credible path forward.
      - listitem [ref=e78]:
        - strong [ref=e79]: Keep the answer.
        - text: Guides and paper sources become cross-referenced Markdown in the repository, ready for the agent’s next step.
    - heading "Papers or a guide" [level=2] [ref=e80]
    - paragraph [ref=e81]: Ask your agent to find a candidate paper list with abstracts and source links, or commission a research guide. Paper discovery returns up to 30 candidates (10 by default).
    - heading "Every guide ends with its own verification" [level=2] [ref=e82]
    - paragraph [ref=e83]:
      - text: A completed guide carries a verification pass. Claims are extracted from the draft and checked against current primary documentation. The delivered guide ends with a
      - strong [ref=e84]: Verification
      - text: section listing corrections with their source URLs, claims that could not be verified, and the limits of the check.
    - paragraph [ref=e85]: This is not a proof of correctness. It covers the highest-consequence claims, and a claim it could not confirm is labeled unverified rather than quietly dropped. Where the Verification section corrects the body text above it, the correction is the more current statement.
    - heading "Ask. Research. Build." [level=2] [ref=e86]
    - list [ref=e87]:
      - listitem [ref=e88]: Ask your coding agent the hard question in the context of your project.
      - listitem [ref=e89]: MissingManual searches papers, source code, benchmarks, documentation, and the obscure parts of the internet where the answer may be hiding.
      - listitem [ref=e90]: Your agent receives checked research, saves it in the repository, and uses it to continue the work.
    - paragraph [ref=e91]: Set it up once and add a card once. After that, MissingManual runs when you ask. If a bank ever needs your attention, your agent gives you the link to resolve it.
    - heading "Simple pricing" [level=2] [ref=e92]
    - paragraph [ref=e93]:
      - text: A successful research run charges measured provider cost, rounded up to the next USD cent, plus exactly
      - strong [ref=e94]: $2.00
      - text: ", capped by your authorization. A failed or cancelled run charges"
      - strong [ref=e95]: $0
      - text: and fully releases or refunds the hold. If the final cost cannot be verified, you are not charged and the hold is released or refunded. The result is withheld until the issue is resolved.
      - link "See the arithmetic" [ref=e96] [cursor=pointer]:
        - /url: /pricing.md
      - text: .
    - heading "Results land in your repository" [level=2] [ref=e97]
    - paragraph [ref=e98]:
      - text: With the
      - code [ref=e99]: missingmanual
      - text: "package, your coding agent saves the result into your own repo instead of leaving it in a chat log: the guide, paper sources converted to Markdown, provenance for each file, and reciprocal index links. Tell your agent \"links only\" or \"no file changes\" and nothing is written."
    - heading "When the docs do not answer the question" [level=2] [ref=e100]
    - paragraph [ref=e101]: MissingManual is for technical subjects that are new, poorly documented, or contradicted by their release notes. If official documentation already answers your question, start there.
    - heading "Your results stay private" [level=2] [ref=e102]
    - paragraph [ref=e103]:
      - text: Results are not published or searchable here. Your agent retrieves yours using its private retrieval details, which expire after
      - strong [ref=e104]: 30 days
      - text: ". Save the result and receipt before expiry. There is no account-based recovery. Enrolling a card does not change this: enrollment saves a payment method, not your research."
