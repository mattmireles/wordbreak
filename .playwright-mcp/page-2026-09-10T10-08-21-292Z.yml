  - main [ref=e16]:
    - paragraph [ref=e17]: Deep research for AI coding agents
    - heading "The answer is out there. Your model just doesn’t know it." [level=1] [ref=e18]: The answer is out there.Your model just doesn’t know it.
    - paragraph [ref=e19]: MissingManual.ai searches the far corners of technical knowledge—from obscure forums and arXiv papers to source code, benchmarks, and forgotten documentation—checks the evidence, and turns it into actionable guides your coding agent can use inside your repository.
    - paragraph [ref=e20]: Built for AI researchers, reverse engineers, and systems builders working on problems ordinary search and everyday coding agents cannot solve.
    - figure [ref=e21]:
      - 'img "MissingManual connects scattered technical sources to the answer: The answer is out there. Your model just doesn’t know it." [ref=e22]'
    - heading "The problems that created MissingManual" [level=2] [ref=e23]
    - list [ref=e24]:
      - listitem [ref=e25]: Why did an Apple Silicon Whisper fine-tuning run keep producing plausible WER after an asynchronous Metal command-buffer fault corrupted its decoder output?
      - listitem [ref=e26]: Can a frozen RNNT decoder batch active hypotheses and hoist predictor and joint projections without changing blank handling, duplicate recombination, or beam-search WER?
      - listitem [ref=e27]: Which Core ML tensor-axis constraint prevents an autoregressive generator from compiling for the Neural Engine on an older iPhone, even when conversion succeeds on a Mac?
    - paragraph [ref=e28]: "The output is an implementation artifact: cited constraints, failure modes, concrete patches, and the smallest experiment that can falsify the recommendation."
    - generic [ref=e29]:
      - paragraph [ref=e30]: The Collective Library
      - heading "Read the work, not a teaser" [level=2] [ref=e31]
      - paragraph [ref=e32]: Complete technical reports with code, failure signatures, measured constraints, evidence labels, citations, corrections, and falsification gates. Private paths and internal campaign controls are removed; the engineering is intact.
      - generic [ref=e33]:
        - article [ref=e34]:
          - paragraph [ref=e35]: Metal / data integrity
          - heading "Command-buffer fault → corrupted token stream → false WER" [level=3] [ref=e36]
          - paragraph [ref=e37]: Synchronize before decode. Validate dtype, rank, vocabulary bounds, and sentinel distributions. Invalidate every result after the first device fault.
          - link "Read the full report" [ref=e38] [cursor=pointer]:
            - /url: /reports/metal-gpu-fault-detection-pytorch
        - article [ref=e39]:
          - paragraph [ref=e40]: RNNT / decoder hot loop
          - heading "Hoist joint projections without changing beam semantics" [level=3] [ref=e41]
          - paragraph [ref=e42]: Batch active hypotheses into fixed-shape predictor and joint calls while preserving blank handling, prune order, recombination, tokens, and scores.
          - link "Read the full report" [ref=e43] [cursor=pointer]:
            - /url: /reports/rnnt-beam-search-apple-silicon
        - article [ref=e44]:
          - paragraph [ref=e45]: Core ML / ANE compiler
          - heading "Conversion succeeds. The Neural Engine plan does not compile." [level=3] [ref=e46]
          - paragraph [ref=e47]: Separate conversion, plan compilation, graph placement, first load, and warmed inference. Probe the minimum fixed-shape generator on the target SoC.
          - link "Read the full report" [ref=e48] [cursor=pointer]:
            - /url: /reports/a14-coreml-generator-execution
        - article [ref=e49]:
          - paragraph [ref=e50]: Core ML / graph surgery
          - heading "Fused SDPA is not proof of ANE execution" [level=3] [ref=e51]
          - paragraph [ref=e52]: Separate MIL graph spelling, residual-path correctness, compute-plan placement, and physical execution on a base M1.
          - link "Read the full report" [ref=e53] [cursor=pointer]:
            - /url: /reports/coreml-fused-sdpa-base-m1
      - paragraph [ref=e54]:
        - link "Browse all 15 full reports →" [ref=e55] [cursor=pointer]:
          - /url: /examples
    - heading "Start with your agent" [level=2] [ref=e56]
    - generic [ref=e57]:
      - blockquote [ref=e58]:
        - paragraph [ref=e59]:
          - text: Set up MissingManual in this repo — a deep-research service I use. Run
          - code [ref=e60]: npx -y missingmanual setup --client claude-code
          - text: (or
          - code [ref=e61]: codex
          - text: /
          - code [ref=e62]: cursor
          - text: "for those agents). It adds an MCP server and one skill to this project. Docs:"
