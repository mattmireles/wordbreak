    - main [ref=f7e16]:
      - paragraph [ref=f7e17]: Claude Code · Codex · Cursor
      - heading "Install MissingManual" [level=1] [ref=f7e18]
      - paragraph [ref=f7e19]: Install one skill, save a card once, and ask your agent to research. No signup, password, dashboard, or API key.
      - heading "Give this to your agent" [level=2] [ref=f7e20]
      - generic [ref=f7e21]:
        - blockquote [ref=f7e22]:
          - paragraph [ref=f7e23]:
            - text: Set up MissingManual in this repo — a deep-research service I use. Run
            - code [ref=f7e24]: npx -y missingmanual setup --client claude-code --email [my email]
            - text: (or
            - code [ref=f7e25]: codex
            - text: /
            - code [ref=f7e26]: cursor
            - text: "for those agents). It adds an MCP server and one skill to this project. Docs:"
            - link "https://missingmanual.ai/install.md" [ref=f7e27] [cursor=pointer]:
              - /url: https://missingmanual.ai/install.md
        - button "Copy prompt to clipboard" [ref=f7e28] [cursor=pointer]
      - heading "Two ways to install" [level=2] [ref=f7e32]
      - list [ref=f7e33]:
        - listitem [ref=f7e34]:
          - link [ref=f7e35] [cursor=pointer]:
            - /url: "#the-missingmanual-package"
            - text: The
            - code [ref=f7e36]: missingmanual
            - text: package
          - text: — the default for Codex CLI, Claude Code, and Cursor. Save a card once; later requests run without another website visit and results land in your repository.
        - listitem [ref=f7e37]:
          - link "The remote MCP server" [ref=f7e38] [cursor=pointer]:
            - /url: "#remote-mcp-endpoint"
          - text: — for any Streamable HTTP MCP client that prefers a separate Stripe checkout for every run.
      - paragraph [ref=f7e39]: Both paths reach the same service at the same price. Enrollment is opt-in and is never a prerequisite for anonymous checkout.
      - heading "The missingmanual package" [level=2] [ref=f7e40]
      - paragraph [ref=f7e41]: "Run one command from the repository you want your agent to research:"
      - generic [ref=f7e42]:
        - code [ref=f7e44]: npx -y missingmanual setup --client codex --email you@example.com
        - button "Copy to clipboard" [ref=f7e45] [cursor=pointer]
      - paragraph [ref=f7e49]:
        - text: Replace
        - code [ref=f7e50]: codex
        - text: with
        - code [ref=f7e51]: claude-code
        - text: or
        - code [ref=f7e52]: cursor
        - text: . The email is required to save a card. MissingManual uses it only to reach you when a future payment needs your attention.
      - paragraph [ref=f7e53]:
        - text: The command installs the local MCP server and the single
        - code [ref=f7e54]: missingmanual
        - text: "skill, then prints a private Stripe link. Your agent hands you the link; you open it and save your card yourself. Then run the same setup command again; it finishes enrollment without creating a second account or charge. Restart your coding agent, then say:"
      - generic [ref=f7e55]:
        - blockquote [ref=f7e56]:
          - paragraph [ref=f7e57]: Use missingmanual to research [your question].
        - button "Copy prompt to clipboard" [ref=f7e58] [cursor=pointer]
      - paragraph [ref=f7e62]:
        - text: That is the entire routine. Your agent chooses papers or a guide, waits for the checked result, and saves it into your repository. Tell it
        - code [ref=f7e63]: links only
        - text: or
        - code [ref=f7e64]: no file changes
        - text: when you do not want local files.
      - paragraph [ref=f7e65]:
        - text: Installation is project-scoped and preserves existing configuration. It writes
        - code [ref=f7e66]: .codex/config.toml
        - text: and
        - code [ref=f7e67]: .agents/skills/missingmanual/SKILL.md
        - text: for Codex,
        - code [ref=f7e68]: .mcp.json
        - text: and
        - code [ref=f7e69]: .claude/skills/missingmanual/SKILL.md
        - text: for Claude Code, or
        - code [ref=f7e70]: .cursor/mcp.json
        - text: and
        - code [ref=f7e71]: .cursor/skills/missingmanual/SKILL.md
        - text: for Cursor. It backs up an existing configuration before changing it; repeated setup does not duplicate entries.
      - heading "Package commands" [level=2] [ref=f7e72]
      - list [ref=f7e73]:
        - listitem [ref=f7e74]:
          - code [ref=f7e75]: missingmanual setup --client codex|claude-code|cursor --email you@example.com
          - text: — install the server and skill, then start or finish one-time card enrollment.
        - listitem [ref=f7e76]:
          - code [ref=f7e77]: missingmanual install --client codex|claude-code|cursor
          - text: — add the server and skill without enrolling a card.
        - listitem [ref=f7e78]:
          - code [ref=f7e79]: missingmanual uninstall --client codex|claude-code|cursor
          - text: — remove that entry, and the installed skill if you have not edited it. It deletes no local research and no saved credential.
        - listitem [ref=f7e80]:
          - code [ref=f7e81]: missingmanual revoke
          - text: — end this installation's authority to bill and forget its credential. Your saved card stays at Stripe;
          - code [ref=f7e82]: missingmanual enroll
          - text: starts again.
        - listitem [ref=f7e83]:
          - code [ref=f7e84]: missingmanual doctor
          - text: — report, per client, whether the server and skill are installed, and whether this machine holds an active enrollment.
          - code [ref=f7e85]: "--client"
          - text: narrows it to one.
        - listitem [ref=f7e86]:
          - code [ref=f7e87]: missingmanual enroll
          - text: — start card enrollment.
          - code [ref=f7e88]: "--email <address>"
          - text: is required;
          - code [ref=f7e89]: "--label <name>"
          - text: is optional.
        - listitem [ref=f7e90]:
          - code [ref=f7e91]: missingmanual enroll-poll
          - text: — finish enrollment after the card is saved.
        - listitem [ref=f7e92]:
          - code [ref=f7e93]: missingmanual serve
          - text: — run the local stdio MCP server. Your client runs this for you; you do not run it by hand.
      - heading "Enroll a card once" [level=2] [ref=f7e94]
      - paragraph [ref=f7e95]: "Enrollment is optional. It is not a signup: no password, no dashboard, nothing to log into. It saves a card with Stripe and issues a credential scoped to that one installation, so later research requests you ask for bill without a checkout page each time."
      - generic [ref=f7e96]:
        - code [ref=f7e98]: "missingmanual enroll --email you@example.com # open the printed link, save a card, then: missingmanual enroll-poll"
        - button "Copy to clipboard" [ref=f7e99] [cursor=pointer]
      - paragraph [ref=f7e103]:
        - text: The
        - code [ref=f7e104]: "--email"
        - text: address is required and used only to reach you when a charge needs your action. Consent at enrollment covers future research
        - emphasis [ref=f7e105]: you request
        - text: ", at the same"
        - strong [ref=f7e106]: $25
        - text: per-job ceiling. It does not authorize autonomous or scheduled research. Revoke at any time with
        - code [ref=f7e107]: missingmanual revoke
        - text: ": it ends this installation's authority to bill and forgets the credential locally. Your saved card is untouched at Stripe."
        - code [ref=f7e108]: missingmanual uninstall
        - text: only removes the MCP entry from one project's config; it deliberately does not revoke, and it tells you so if you are still enrolled.
      - heading "When a charge needs you" [level=2] [ref=f7e109]
      - paragraph [ref=f7e110]: If an automatic charge needs a human — the bank asks for authentication, or the card is declined — the tool call that hit the problem fails with a reason and an actionable URL. Open that URL to resolve it. No research runs on that job until it is resolved, and nothing is captured.
      - paragraph [ref=f7e111]: MissingManual also emails the address you enrolled with. Email is best-effort. It is never guaranteed to be received, so treat the URL returned to the tool call as the reliable channel.
      - heading "What the package saves" [level=2] [ref=f7e112]
      - paragraph [ref=f7e113]:
        - text: The local server adds
        - code [ref=f7e114]: save_guide
        - text: and
        - code [ref=f7e115]: save_papers
        - text: alongside the forwarded research tools. They detect the guides and papers convention your repo already uses, falling back to
        - code [ref=f7e116]: "docs/research/{guides,papers}"
        - text: when there is none. Writes are atomic, never silently overwrite different content at the same path, and add provenance and an index entry.
        - code [ref=f7e117]: save_papers
        - text: downloads full text and converts ordinary text PDFs to Markdown. A source is reported as
        - code [ref=f7e118]: blocked
        - text: only when it cannot be downloaded, safely converted, or contains no extractable text. If you ask for links only, or for no file changes, nothing is written.
      - paragraph [ref=f7e119]: The package never returns a raw job id or capability to your agent. It hands back an opaque local handle, and the same handle always resumes the same paid job.
      - heading "Remote MCP endpoint" [level=2] [ref=f7e120]
      - paragraph [ref=f7e121]: Available today, with no package and no enrollment. Anonymous, one Stripe checkout per run.
      - generic [ref=f7e122]:
        - code [ref=f7e124]: https://missingmanual.ai/mcp
        - button "Copy to clipboard" [ref=f7e125] [cursor=pointer]
      - paragraph [ref=f7e129]:
        - text: Use a remote MCP connection with
        - strong [ref=f7e130]: Streamable HTTP
        - text: transport. No authorization header is needed for discovery. In other compatible clients, add this URL using their remote MCP server settings; configuration formats differ. Do not fetch
        - code [ref=f7e131]: /mcp
        - text: as a document.
      - heading "Claude Code (remote MCP)" [level=2] [ref=f7e132]
      - generic [ref=f7e133]:
        - code [ref=f7e135]: claude mcp add --transport http missing-manual https://missingmanual.ai/mcp
        - button "Copy to clipboard" [ref=f7e136] [cursor=pointer]
      - paragraph [ref=f7e140]:
        - text: See the
        - link "Claude Code MCP documentation" [ref=f7e141] [cursor=pointer]:
          - /url: https://code.claude.com/docs/en/mcp
        - text: .
      - heading "Codex CLI (remote MCP)" [level=2] [ref=f7e142]
      - generic [ref=f7e143]:
        - code [ref=f7e145]: codex mcp add missing-manual --url https://missingmanual.ai/mcp
        - button "Copy to clipboard" [ref=f7e146] [cursor=pointer]
      - heading "Cursor (remote MCP)" [level=2] [ref=f7e150]
      - paragraph [ref=f7e151]:
        - text: Merge this entry into
        - code [ref=f7e152]: mcpServers
        - text: in
        - code [ref=f7e153]: ~/.cursor/mcp.json
        - text: for all projects, or
        - code [ref=f7e154]: .cursor/mcp.json
        - text: for this project. Preserve your existing servers.
      - generic [ref=f7e155]:
        - code [ref=f7e157]: "{ \"mcpServers\": { \"missing-manual\": { \"url\": \"https://missingmanual.ai/mcp\" } } }"
        - button "Copy to clipboard" [ref=f7e158] [cursor=pointer]
      - paragraph [ref=f7e162]:
        - text: See the
        - link "Cursor MCP guide" [ref=f7e163] [cursor=pointer]:
          - /url: https://cursor.com/guides/coding-agent-mcp
        - text: . Reconnect or restart your client if needed, then confirm it offers
        - code [ref=f7e164]: find_papers
        - text: ","
        - code [ref=f7e165]: create_guide
        - text: ", and"
        - code [ref=f7e166]: get_result
        - text: .
        - code [ref=f7e167]: get_guide
        - text: remains compatible.
      - heading "Choose an action" [level=2] [ref=f7e168]
      - list [ref=f7e169]:
        - listitem [ref=f7e170]:
          - code [ref=f7e171]: find_papers
          - text: — Discover a candidate paper list in markdown, with abstracts and source links only.
          - code [ref=f7e172]: maxPapers
          - text: is an integer from 1–30, default 10.
        - listitem [ref=f7e173]:
          - code [ref=f7e174]: create_guide
          - text: — Request a research guide in markdown.
      - paragraph [ref=f7e175]:
        - text: Both use the same checkout and receipt flow. Poll
        - code [ref=f7e176]: get_result
        - text: for either action;
        - code [ref=f7e177]: get_guide
        - text: remains compatible. Paper discovery on this path does not ingest full papers into a local repository or perform local QA.
      - heading "Request papers or a guide" [level=2] [ref=f7e178]
      - paragraph [ref=f7e179]:
        - text: Generate the idempotency key with a cryptographic random generator (for example,
        - code [ref=f7e180]: crypto.randomUUID()
        - text: ), not a topic, timestamp, or guessable sequence. Keep it stable for this request.
      - paragraph [ref=f7e181]:
        - text: Call your chosen action without payment metadata. Use a focused
        - code [ref=f7e182]: topic
        - text: ", a cryptographically random, stable"
        - code [ref=f7e183]: idempotencyKey
        - text: ", and"
        - code [ref=f7e184]: "maxTotalChargeUsdMicros: 25000000"
        - text: ($25, including the fee). Follow the connected tool schema for optional context and source constraints.
      - generic [ref=f7e185]:
        - code [ref=f7e187]: "{ \"topic\": \"Research the technical question and constraints agreed with the customer\", \"idempotencyKey\": \"REPLACE_WITH_A_CRYPTOGRAPHICALLY_RANDOM_KEY\", \"maxTotalChargeUsdMicros\": 25000000 }"
        - button "Copy to clipboard" [ref=f7e188] [cursor=pointer]
      - paragraph [ref=f7e192]:
        - text: For
        - code [ref=f7e193]: find_papers
        - text: ", use the same common fields shown above and optionally add"
        - code [ref=f7e194]: "\"maxPapers\": 10"
        - text: . Keep the same action and identical input on retries.
      - paragraph [ref=f7e195]:
        - text: The response contains
        - code [ref=f7e196]: jobId
        - text: ","
        - code [ref=f7e197]: capability
        - text: ","
        - code [ref=f7e198]: "status: \"payment_required\""
        - text: ", a Stripe-hosted"
        - code [ref=f7e199]: paymentUrl
        - text: ","
        - code [ref=f7e200]: "maximumAuthorizationUsdMicros: 25000000"
        - text: ", and"
        - code [ref=f7e201]: pollAfterSeconds
        - text: . Keep the entire initial response privately, including the payment URL and capability; share the checkout link only with the customer. Do not substitute example values.
        - code [ref=f7e202]: maximumAuthorizationUsdMicros
        - text: is the requested maximum, not evidence of a hold.
        - code [ref=f7e203]: authorizedUsdMicros
        - text: describes only an actually authorized amount.
      - heading "Approve the hold" [level=2] [ref=f7e204]
      - paragraph [ref=f7e205]:
        - text: Show the customer the returned
        - code [ref=f7e206]: paymentUrl
        - text: and explain the
        - strong [ref=f7e207]: $25 card authorization hold
        - text: . The customer opens Stripe checkout and approves it. The agent must never enter payment details, collect card information, or approve payment on the customer's behalf.
      - paragraph [ref=f7e208]:
        - text: Use the returned checkout expiry when provided; otherwise the payment link lasts
        - strong [ref=f7e209]: 24 hours
        - text: . Research starts automatically once the server verifies authorization. Returning from Stripe is not proof of authorization;
        - code [ref=f7e210]: get_result
        - text: is the source of status. Leaving checkout does not cancel the backend job. No research starts before verified authorization.
      - heading "Return to the agent" [level=2] [ref=f7e211]
      - paragraph [ref=f7e212]:
        - text: Poll
        - code [ref=f7e213]: get_result
        - text: with the same
        - code [ref=f7e214]: jobId
        - text: and
        - code [ref=f7e215]: capability
        - text: ", respecting"
        - code [ref=f7e216]: pollAfterSeconds
        - text: . Polling has no per-call fee. It can verify human payment and automatically start or resume the previously requested, approved research job; it never creates an additional paid job. Do not create another job because checkout is pending or research is still running. If an identical
        - code [ref=f7e217]: find_papers
        - text: or
        - code [ref=f7e218]: create_guide
        - text: retry is necessary, include the original
        - code [ref=f7e219]: idempotencyKey
        - text: and the returned
        - code [ref=f7e220]: capability
        - text: in the tool arguments. The optional
        - code [ref=f7e221]: capability
        - text: field is required to replay an existing job; a replay without it returns a conflict. Do not include it on the initial request. If the initial response was lost and no payment URL was delivered, a new cryptographically random key may be used to retry; do not use this exception after receiving a checkout link.
      - paragraph [ref=f7e222]:
        - text: Research can take
        - strong [ref=f7e223]: up to 90 minutes
        - text: . After successful settlement,
        - code [ref=f7e224]: get_result
        - text: returns markdown and an itemized receipt. Save both. A completed guide ends with a
        - strong [ref=f7e225]: Verification
        - text: "section: corrections against current primary documentation with their source URLs, claims that could not be verified, and the limits of the check. Report those limits rather than presenting the guide as unconditionally verified, and treat a correction as more current than the body text above it. Capabilities expire after"
        - strong [ref=f7e226]: 30 days
        - text: ; keep them private and retrieve your result before expiry. There is no account-based recovery.
      - paragraph [ref=f7e227]:
        - text: If checkout expires or status reports an error, explain the returned status and stop automatic retries; do not create a new paid request without the customer's direction. A failed or cancelled run charges $0 and fully releases or refunds the hold.
        - code [ref=f7e228]: pricing_gap
        - text: also charges $0 and fully releases or refunds; a result stays withheld unless an operator records an auditable decision to release it free of charge. See
        - link "Pricing" [ref=f7e229] [cursor=pointer]:
          - /url: /pricing.md
        - text: .
      - heading "Optional advanced payment path" [level=2] [ref=f7e230]
      - paragraph [ref=f7e231]: Clients with existing Stripe Shared Payment Token (SPT) support can still supply payment credentials in MCP protocol metadata under their caller's spending authority. SPT is optional; ordinary clients use hosted checkout. Never put credentials in tool arguments, prompts, files, logs, or output.
      - heading "Optional agent skill" [level=2] [ref=f7e232]
      - paragraph [ref=f7e233]:
        - text: The
        - link "MissingManual client skill" [ref=f7e234] [cursor=pointer]:
          - /url: /skills/missingmanual/SKILL.md
        - text: describes safe creation, human payment approval, capability handling, polling, and receipts. The connected MCP tool schema remains authoritative.
      - heading "Check availability" [level=2] [ref=f7e235]
      - generic [ref=f7e236]:
        - code [ref=f7e238]: curl -s https://missingmanual.ai/healthz
        - button "Copy to clipboard" [ref=f7e239] [cursor=pointer]
      - paragraph [ref=f7e243]: This reports service health and whether paid starts are enabled. It starts nothing and costs nothing.
