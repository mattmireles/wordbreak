          - code [ref=f5e393]: sudo /usr/bin/log collect \ --device-udid "<device-id>" \ --last 15m \ --output benchmark.logarchive /usr/bin/log show \ --archive benchmark.logarchive \ --predicate 'process == "Benchmark"' \ --style ndjson
          - button "Copy to clipboard" [ref=f5e394] [cursor=pointer]
        - paragraph [ref=f5e398]:
          - strong [ref=f5e399]: "Correction to the raw report:"
