        - heading "3. Stage and Verify App-Container Data" [level=2] [ref=f5e177]
        - heading "3.1. Copy a directory, not a file into a missing parent" [level=3] [ref=f5e178]
        - paragraph [ref=f5e179]: "The basic app-container copy syntax is:"
        - generic [ref=f5e180]:
          - code [ref=f5e182]: xcrun devicectl device copy to \ --device "<device-id>" \ --domain-type appDataContainer \ --domain-identifier com.example.benchmark \ --source ./run-input \ --destination Documents/run-input \ --json-output copy.json
          - button "Copy to clipboard" [ref=f5e183] [cursor=pointer]
        - paragraph [ref=f5e187]:
          - strong [ref=f5e188]: "Firsthand implementation evidence:"
          - text: "a file-to-file copy whose destination parent did not already exist completed without producing the target file. Copying the whole local directory created the destination directory and transferred its contents. Therefore:"
        - list [ref=f5e189]:
          - listitem [ref=f5e190]: Build one local staging directory for each logical payload.
          - listitem [ref=f5e191]: Copy that directory as a unit.
          - listitem [ref=f5e192]: List the remote destination after every copy.
          - listitem [ref=f5e193]: Verify expected names, sizes, and, when practical, content hashes in the app before loading a model.
        - paragraph [ref=f5e194]:
          - text: Current command help says
          - code [ref=f5e195]: copy to
          - text: skips files that have not been modified and supports repeated
          - code [ref=f5e196]: "--source"
          - text: flags. It documents an overall
          - code [ref=f5e197]: "--timeout"
          - text: ", but it does not promise resumable transfer."
          - strong [ref=f5e198]: "Unverified hypothesis:"
          - text: interrupted multi-gigabyte transfers must be restarted. Design staging to be idempotent and independently verifiable.
        - heading "3.2. List the domain directly" [level=3] [ref=f5e199]
        - paragraph [ref=f5e200]: "The raw report correctly identified a direct file-listing command:"
        - generic [ref=f5e201]:
          - code [ref=f5e203]: xcrun devicectl device info files \ --device "<device-id>" \ --domain-type appDataContainer \ --domain-identifier com.example.benchmark \ --subdirectory Documents/run-input \ --recurse \ --json-output files.json
          - button "Copy to clipboard" [ref=f5e204] [cursor=pointer]
        - paragraph [ref=f5e208]:
          - text: Current help confirms
          - code [ref=f5e209]: "--subdirectory"
          - text: ", recursive listing, filtering, sorting, and JSON output. Use this rather than treating a zero exit status from"
          - code [ref=f5e210]: copy to
          - text: as proof.
        - heading [level=3] [ref=f5e211]:
          - text: 3.3.
          - code [ref=f5e212]: "--remove-existing-content"
          - text: can wipe the container
        - paragraph [ref=f5e213]:
          - text: Current
          - code [ref=f5e214]: copy to
          - text: help describes
          - code [ref=f5e215]: "--remove-existing-content"
          - text: as removing files from the destination directory and says it applies only to directory transfers.
        - paragraph [ref=f5e216]:
          - strong [ref=f5e217]: "Firsthand the reference implementation contradiction:"
          - code [ref=f5e218]: "--remove-existing-content true"
          - text: emptied the entire app data container, not only the named subtree. The observed behavior is more destructive than the help text implies. Do not use this flag in a qualifying workflow.
        - paragraph [ref=f5e219]: "The safer pattern is in-app, allow-listed cleanup:"
        - generic [ref=f5e220]:
          - code [ref=f5e222]: "let fileManager = FileManager.default let staleDirectory = documentsURL.appendingPathComponent(\"bundles/stale\", isDirectory: true) if fileManager.fileExists(atPath: staleDirectory.path) { try fileManager.removeItem(at: staleDirectory) }"
          - button "Copy to clipboard" [ref=f5e223] [cursor=pointer]
        - paragraph [ref=f5e227]:
          - text: Constrain deletion to a known child beneath a known app-owned root. Refuse absolute paths,
          - code [ref=f5e228]: ..
          - text: ", symlinks that escape the root, or an empty run identifier."
        - heading "3.4. Other domains" [level=3] [ref=f5e229]
        - paragraph [ref=f5e230]:
          - text: Current command help lists
          - code [ref=f5e231]: temporary
          - text: ","
          - code [ref=f5e232]: appDataContainer
          - text: ","
          - code [ref=f5e233]: appGroupDataContainer
          - text: ", and"
          - code [ref=f5e234]: systemCrashLogs
          - text: .
        - paragraph [ref=f5e235]:
          - text: For an App Group, use
          - code [ref=f5e236]: appGroupDataContainer
          - text: "and the App Group identifier, not the application bundle identifier:"
        - generic [ref=f5e237]:
