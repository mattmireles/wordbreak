        - heading "11. Debugging Playbook" [level=2] [ref=f5e609]
        - heading "Copy reports success but the file is absent" [level=3] [ref=f5e610]
        - list [ref=f5e611]:
          - listitem [ref=f5e612]:
            - text: List the intended parent with
            - code [ref=f5e613]: device info files
            - text: .
          - listitem [ref=f5e614]: If the parent is absent, copy the containing local directory instead of the file.
          - listitem [ref=f5e615]: Pull or app-hash the staged payload before loading it.
          - listitem [ref=f5e616]: Preserve the copy JSON and file-list JSON as operational evidence.
        - heading "Previous app state disappeared" [level=3] [ref=f5e617]
        - list [ref=f5e618]:
          - listitem [ref=f5e619]:
            - text: Search the driver command for
            - code [ref=f5e620]: "--remove-existing-content"
            - text: .
          - listitem [ref=f5e621]: Treat the entire container as potentially wiped.
          - listitem [ref=f5e622]: Restore only known public inputs.
          - listitem [ref=f5e623]: Remove the flag permanently and move cleanup into bounded app logic.
        - heading [level=3] [ref=f5e624]:
          - text: The app receives
          - code [ref=f5e625]: "--device"
          - text: or other unexpected arguments
        - list [ref=f5e626]:
          - listitem [ref=f5e627]:
            - text: Capture the app's
            - code [ref=f5e628]: CommandLine.arguments
            - text: to stderr or a result file.
          - listitem [ref=f5e629]:
            - text: Move every
            - code [ref=f5e630]: devicectl
            - text: option before the bundle identifier.
          - listitem [ref=f5e631]: Keep only app arguments after the bundle identifier.
        - heading [level=3] [ref=f5e632]:
          - code [ref=f5e633]: "--console"
          - text: is blank
        - list [ref=f5e634]:
          - listitem [ref=f5e635]:
            - text: Confirm the process exists with
            - code [ref=f5e636]: device info processes
            - text: .
          - listitem [ref=f5e637]: Emit one flushed stderr line.
          - listitem [ref=f5e638]: Poll for an app-owned progress or done file.
          - listitem [ref=f5e639]: Pull a historical log archive if OSLog was enabled.
        - heading "Signing reports \"No Accounts\"" [level=3] [ref=f5e640]
        - list [ref=f5e641]:
          - listitem [ref=f5e642]: Decide whether the runner is supposed to use an interactive Xcode account. Do not assume.
          - listitem [ref=f5e643]: If no account is available, select a manually managed development profile that authorizes the target.
          - listitem [ref=f5e644]: Verify that the development identity and private key are visible to the shell.
          - listitem [ref=f5e645]: Build with manual signing and inspect the final entitlements before install.
        - heading "Signing says the profile is Xcode-managed but manual signing is required" [level=3] [ref=f5e646]
        - list [ref=f5e647]:
          - listitem [ref=f5e648]: Stop mixing an Xcode-managed profile with manual signing.
          - listitem [ref=f5e649]: Create or obtain a non-Xcode-managed development profile for the app and registered target.
          - listitem [ref=f5e650]: Install it without logging its private payload.
          - listitem [ref=f5e651]:
            - text: Rebuild with
            - code [ref=f5e652]: PROVISIONING_PROFILE_SPECIFIER
            - text: naming that profile.
        - heading "The process vanishes during model load" [level=3] [ref=f5e653]
        - list [ref=f5e654]:
          - listitem [ref=f5e655]: Do not retry immediately.
          - listitem [ref=f5e656]:
            - text: Pull
            - code [ref=f5e657]: systemCrashLogs
            - text: for the bounded launch window.
          - listitem [ref=f5e658]: Check app resource-limit reports and Core ML, E5, or ANE service reports.
          - listitem [ref=f5e659]: Separate cold compilation from warm inference.
          - listitem [ref=f5e660]:
            - text: Try an AOT-compiled
            - code [ref=f5e661]: .mlmodelc
            - text: as a diagnostic, then remeasure peak footprint.
        - heading "Compute plan reports no device or no cost" [level=3] [ref=f5e662]
        - list [ref=f5e663]:
          - listitem [ref=f5e664]: Confirm the model is an ML Program and the walked operation belongs to the loaded plan's structure.
          - listitem [ref=f5e665]:
            - text: Keep optional handling;
            - code [ref=f5e666]: nil
            - text: means the value could not be determined.
          - listitem [ref=f5e667]: Record operation name, model signature, compute units, OS, and device class without a unique identifier.
          - listitem [ref=f5e668]: Do not replace missing plan data with guessed placement.
        - heading "12. Ingest Decision Log" [level=2] [ref=f5e669]
