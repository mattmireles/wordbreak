        - heading "1. Operating Model" [level=2] [ref=f5e66]
        - paragraph [ref=f5e67]: "A robust run has five explicit boundaries:"
        - generic [ref=f5e68]:
          - code [ref=f5e70]: signed .app -> install -> stage one immutable input directory -> launch one configuration -> pull one result receipt and all relevant crash evidence
          - button "Copy to clipboard" [ref=f5e71] [cursor=pointer]
        - paragraph [ref=f5e75]: Treat the host, the app container, and system diagnostics as separate stores. A successful command invocation is not proof that a file arrived, an app completed, a model used the requested device, or no system daemon crashed.
        - paragraph [ref=f5e76]:
          - text: For automation, prefer
          - code [ref=f5e77]: "--json-output <path>"
          - text: where
          - code [ref=f5e78]: devicectl
          - text: supports it. Current command help states that a user-provided JSON file is the only supported interface for programs consuming command output. Human-readable stdout is not a stable parser contract.
        - paragraph [ref=f5e79]: Use privacy-safe run identifiers in paths and receipts. Do not record device identifiers, device names, signing credentials, private audio paths, or transcript content.
        - heading "2. Build and Install a Signed App" [level=2] [ref=f5e80]
        - paragraph [ref=f5e81]:
          - code [ref=f5e82]: devicectl device install app
          - text: installs an already signed
          - code [ref=f5e83]: .app
          - text: "; it does not solve signing or provisioning:"
        - generic [ref=f5e84]:
          - code [ref=f5e86]: xcrun devicectl device install app \ --device "<device-id>" \ --json-output install.json \ "/path/to/Benchmark.app"
          - button "Copy to clipboard" [ref=f5e87] [cursor=pointer]
        - paragraph [ref=f5e91]: The placeholder device ID is operational input only. Do not persist it in a public receipt.
        - heading "2.1. Manual signing when no Xcode account is signed in" [level=3] [ref=f5e92]
        - paragraph [ref=f5e93]:
          - strong [ref=f5e94]: "Firsthand implementation evidence:"
          - text: automatic signing with
          - code [ref=f5e95]: "-allowProvisioningUpdates"
          - text: "failed with a \"No Accounts\" error when the build host had no account signed into Xcode. An Xcode-managed development profile was then rejected under manual signing. A non-Xcode-managed development profile that included the registered target device worked with manual signing:"
        - generic [ref=f5e96]:
          - code [ref=f5e98]: xcodebuild \ -project Benchmark.xcodeproj \ -scheme Benchmark \ -configuration Release \ -destination "generic/platform=iOS" \ -derivedDataPath .build/xcode \ CODE_SIGN_STYLE=Manual \ CODE_SIGN_IDENTITY="Apple Development" \ PROVISIONING_PROFILE_SPECIFIER="<manual-profile-name>" \ build
          - button "Copy to clipboard" [ref=f5e99] [cursor=pointer]
        - paragraph [ref=f5e103]: The signing identity's private key and the provisioning profile must be available to the shell. The profile must authorize the app identifier, entitlements, team, and target device. Unlocking a keychain can fix private-key access errors, but it does not invent a missing Xcode account or repair a mismatched profile.
        - generic [ref=f5e104]:
          - code [ref=f5e106]: security find-identity -v -p codesigning security cms -D -i "/path/to/profile.mobileprovision" codesign -d --entitlements :- "/path/to/Benchmark.app" codesign --verify --deep --strict --verbose=2 "/path/to/Benchmark.app"
          - button "Copy to clipboard" [ref=f5e107] [cursor=pointer]
        - paragraph [ref=f5e111]: Do not print keychain passwords, private keys, or full provisioning payloads into CI logs.
        - heading "2.2. Archive and export" [level=3] [ref=f5e112]
        - paragraph [ref=f5e113]:
          - text: The raw report's archive/export route is worth keeping for CI systems that produce an archive. Xcode 26.6 marks export method
          - code [ref=f5e114]: development
          - text: deprecated; use
          - code [ref=f5e115]: debugging
          - text: .
        - generic [ref=f5e116]:
          - code [ref=f5e118]: xcodebuild archive \ -workspace Benchmark.xcworkspace \ -scheme Benchmark \ -destination "generic/platform=iOS" \ -archivePath .build/Benchmark.xcarchive \ CODE_SIGN_STYLE=Manual \ CODE_SIGN_IDENTITY="Apple Development" \ PROVISIONING_PROFILE_SPECIFIER="<manual-profile-name>" xcodebuild -exportArchive \ -archivePath .build/Benchmark.xcarchive \ -exportPath .build/export \ -exportOptionsPlist ExportOptions.plist
          - button "Copy to clipboard" [ref=f5e119] [cursor=pointer]
        - paragraph [ref=f5e123]: "A minimal current export configuration can name the profile rather than embedding private identifiers:"
        - generic [ref=f5e124]:
          - code [ref=f5e126]: <?xml version="1.0" encoding="UTF-8"?> <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd"> <plist version="1.0"> <dict> <key>method</key> <string>debugging</string> <key>signingStyle</key> <string>manual</string> <key>signingCertificate</key> <string>Apple Development</string> <key>provisioningProfiles</key> <dict> <key>com.example.benchmark</key> <string>Benchmark Development</string> </dict> </dict> </plist>
          - button "Copy to clipboard" [ref=f5e127] [cursor=pointer]
        - paragraph [ref=f5e131]:
          - strong [ref=f5e132]: "Community / unverified:"
          - text: some headless setups require provisioning profiles to be installed under
          - code [ref=f5e133]: ~/Library/MobileDevice/Provisioning Profiles/
          - text: using the profile's internal identifier as the filename. Other tooling accepts a profile name or identifier in
          - code [ref=f5e134]: provisioningProfiles
          - text: . Inspect the active Xcode version's
          - code [ref=f5e135]: xcodebuild -help
          - text: ; do not assume one naming convention is universal.
        - heading "2.3. Re-signing and signing automation" [level=3] [ref=f5e136]
        - paragraph [ref=f5e137]:
          - strong [ref=f5e138]: "Community / worth trying:"
          - text: "re-signing a prebuilt app or IPA can work when the executable, embedded frameworks, entitlements, app identifier, and profile all agree. Sign nested code before the containing app:"
        - generic [ref=f5e139]:
          - code [ref=f5e141]: for framework in Payload/Benchmark.app/Frameworks/*.framework; do codesign --force --sign "<development-identity>" "$framework" done codesign --force \ --sign "<development-identity>" \ --entitlements Entitlements.plist \ Payload/Benchmark.app
          - button "Copy to clipboard" [ref=f5e142] [cursor=pointer]
        - paragraph [ref=f5e146]:
          - text: This recipe is incomplete for bundles containing extensions, app clips, nested apps, or other signed code. Enumerate and verify the actual bundle graph; do not apply
          - code [ref=f5e147]: "--deep"
          - text: as a substitute for understanding it.
        - paragraph [ref=f5e148]:
          - strong [ref=f5e149]: "Community:"
