            - text: This is the complete technical report. Private filesystem paths, internal run identifiers, campaign-control notes, and repository navigation were removed. Technical claims, code, measurements, evidence labels, citations, corrections, and falsification criteria are preserved.
        - paragraph [ref=f5e24]: September 6, 2026
        - paragraph [ref=f5e25]: "This field guide covers the shell-operated tooling layer for running a Core ML measurement app on a physical iPhone: build and install, stage model data, launch and monitor, collect durable results, inspect compute plans, and recover crash evidence. It is reusable operating guidance, not a verdict on any the reference implementation model or certification campaign."
        - heading "Executive Summary" [level=2] [ref=f5e26]
        - list [ref=f5e27]:
          - listitem [ref=f5e28]:
            - code [ref=f5e29]: devicectl device copy to
            - text: is not
            - code [ref=f5e30]: cp
            - text: .
            - strong [ref=f5e31]: "Firsthand implementation evidence:"
            - text: copying a file to a missing parent inside
            - code [ref=f5e32]: appDataContainer
            - text: can exit without creating anything; copying the containing directory works. Verify every transfer.
          - listitem [ref=f5e33]:
            - text: Never use
            - code [ref=f5e34]: "--remove-existing-content true"
            - text: casually. Current command help describes destination-directory cleanup, but
            - strong [ref=f5e35]: firsthand implementation evidence
            - text: shows it emptied the entire app data container.
          - listitem [ref=f5e36]:
            - text: In
            - code [ref=f5e37]: device process launch
            - text: ", every token after the positional bundle identifier is application"
            - code [ref=f5e38]: argv
            - text: . Put every
            - code [ref=f5e39]: devicectl
            - text: option before that positional argument.
          - listitem [ref=f5e40]:
            - code [ref=f5e41]: "--console"
            - text: connects standard streams and waits for exit, but
            - strong [ref=f5e42]: firsthand implementation evidence
            - text: shows ordinary Swift
            - code [ref=f5e43]: print
            - text: output can remain invisible because stdout is block-buffered. Emit critical progress to stderr and write final receipts to
            - code [ref=f5e44]: Documents
            - text: .
          - listitem [ref=f5e45]:
            - text: Crash evidence is separate from app data.
            - code [ref=f5e46]: systemCrashLogs
            - text: is a supported file-service domain and can contain both app and Core ML or ANE service failures.
          - listitem [ref=f5e47]:
            - text: An on-device
            - code [ref=f5e48]: MLComputePlan
            - text: is target-specific anticipated placement, not a trace of a completed prediction. Read
            - code [ref=f5e49]: deviceUsage(for:)
            - text: and
            - code [ref=f5e50]: estimatedCost(of:)
            - text: ", then use runtime telemetry for an execution claim."
          - listitem [ref=f5e51]: A shell with no Xcode account signed in needs a manually managed development profile and matching development identity. This is firsthand the reference implementation behavior, not a claim that every CI signing setup must be manual.
          - listitem [ref=f5e52]: Community reports about fixed iPhone memory ceilings, JIT compilation spikes, AOT paging, background suspension, and re-signing are useful hypotheses. They remain labeled until reproduced on the target tuple.
        - heading "Evidence Labels" [level=2] [ref=f5e53]
        - list [ref=f5e54]:
