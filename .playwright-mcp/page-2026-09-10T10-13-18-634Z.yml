        - heading "4. Launch and Monitor One Configuration" [level=2] [ref=f5e266]
        - heading "4.1. Argument ordering is a hard boundary" [level=3] [ref=f5e267]
        - paragraph [ref=f5e268]:
          - text: Current command help defines the grammar as
          - code [ref=f5e269]: <bundle-identifier-or-path> [<command-line-arguments> ...]
          - text: .
          - strong [ref=f5e270]: "Firsthand implementation evidence:"
          - text: every token after the positional bundle identifier was forwarded to the launched app.
        - generic [ref=f5e271]:
          - code [ref=f5e273]: "xcrun devicectl device process launch \\ --device \"<device-id>\" \\ --terminate-existing \\ --console \\ --environment-variables '{\"BENCHMARK_MODE\":\"latency\"}' \\ com.example.benchmark \\ --model-path Documents/run-input/encoder.mlmodelc \\ --iterations 100"
          - button "Copy to clipboard" [ref=f5e274] [cursor=pointer]
        - paragraph [ref=f5e278]:
          - text: Here
          - code [ref=f5e279]: "--model-path"
          - text: and
          - code [ref=f5e280]: "--iterations"
          - text: belong to the app. Every
          - code [ref=f5e281]: devicectl
          - text: option, including
          - code [ref=f5e282]: "--device"
          - text: ","
          - code [ref=f5e283]: "--console"
          - text: ","
          - code [ref=f5e284]: "--environment-variables"
          - text: ", and"
          - code [ref=f5e285]: "--terminate-existing"
          - text: ", appears before the bundle identifier."
        - paragraph [ref=f5e286]:
          - text: "No"
          - code [ref=f5e287]: "--"
          - text: separator is required by the documented grammar. Do not introduce one without checking the installed tool's help and the app's observed
          - code [ref=f5e288]: argv
          - text: .
        - heading "4.2. Environment variables have two supported routes" [level=3] [ref=f5e289]
        - paragraph [ref=f5e290]:
          - text: The raw report said environment variables must be passed with
          - code [ref=f5e291]: "--environment-variables"
          - text: ". Current command help documents two routes:"
        - list [ref=f5e292]:
          - listitem [ref=f5e293]: Pass a JSON dictionary before the bundle identifier.
          - listitem [ref=f5e294]:
            - text: Export host variables with a
            - code [ref=f5e295]: DEVICECTL_CHILD_
            - text: prefix.
        - generic [ref=f5e296]:
          - code [ref=f5e298]: export DEVICECTL_CHILD_BENCHMARK_MODE=latency xcrun devicectl device process launch \ --device "<device-id>" \ com.example.benchmark
          - button "Copy to clipboard" [ref=f5e299] [cursor=pointer]
        - paragraph [ref=f5e303]:
          - text: An explicit
          - code [ref=f5e304]: "--environment-variables"
          - text: dictionary overrides prefixed caller variables. Do not put secrets into either route; process environments and logs are not a credential vault.
        - heading "4.3. Lifecycle options" [level=3] [ref=f5e305]
        - list [ref=f5e306]:
          - listitem [ref=f5e307]:
            - code [ref=f5e308]: "--activate"
            - text: is the default where supported and requests foreground activation.
          - listitem [ref=f5e309]:
            - code [ref=f5e310]: "--terminate-existing"
            - text: kills an existing app instance before launch where supported. Use it when a clean process is part of the measurement contract, not as an unconditional default.
          - listitem [ref=f5e311]:
            - code [ref=f5e312]: "--start-stopped"
            - text: launches suspended for debugger attachment.
          - listitem [ref=f5e313]:
            - code [ref=f5e314]: "--console"
            - text: connects standard streams, waits for termination, and forwards catchable signals.
          - listitem [ref=f5e315]:
            - code [ref=f5e316]: "--timeout"
            - text: limits the
            - code [ref=f5e317]: devicectl
            - text: command. It is not proof that the app persisted or completed after the host command exits.
        - paragraph [ref=f5e318]: "Inspect running processes separately:"
        - generic [ref=f5e319]:
          - code [ref=f5e321]: xcrun devicectl device info processes \ --device "<device-id>" \ --filter "name CONTAINS[c] 'Benchmark'" \ --json-output processes.json
          - button "Copy to clipboard" [ref=f5e322] [cursor=pointer]
        - paragraph [ref=f5e326]:
          - strong [ref=f5e327]: "Community / unverified:"
          - text: launching through
          - code [ref=f5e328]: devicectl
          - text: may avoid some launch-time behavior seen with icon launches. Do not convert that anecdote into a watchdog guarantee. Measure startup, foreground state, suspension, and termination on the target OS.
