        - heading "6. Recover Crash Evidence" [level=2] [ref=f5e432]
        - paragraph [ref=f5e433]:
          - code [ref=f5e434]: systemCrashLogs
          - text: is a current
          - code [ref=f5e435]: devicectl
          - text: "file-service domain:"
        - generic [ref=f5e436]:
          - code [ref=f5e438]: xcrun devicectl device copy from \ --device "<device-id>" \ --domain-type systemCrashLogs \ --source . \ --destination ./crashes \ --json-output pull-crashes.json
          - button "Copy to clipboard" [ref=f5e439] [cursor=pointer]
        - paragraph [ref=f5e443]: "List before pulling when a focused selection is useful:"
        - generic [ref=f5e444]:
          - code [ref=f5e446]: xcrun devicectl device info files \ --device "<device-id>" \ --domain-type systemCrashLogs \ --json-output crash-files.json
          - button "Copy to clipboard" [ref=f5e447] [cursor=pointer]
        - paragraph [ref=f5e451]:
          - text: Apple crash reports commonly use
          - code [ref=f5e452]: .ips
          - text: ". Correlate by process, timestamp, run window, and launch metadata rather than filename alone:"
        - generic [ref=f5e453]:
          - code [ref=f5e455]: jq -r '(.procName // .process // "unknown") + " - " + (.timestamp // "unknown")' \ crash.ips
          - button "Copy to clipboard" [ref=f5e456] [cursor=pointer]
        - paragraph [ref=f5e460]:
          - text: Some
          - code [ref=f5e461]: .ips
          - text: files use a JSON metadata line followed by another JSON object; others vary by OS. Inspect the format before hard-coding
          - code [ref=f5e462]: head -n 1
          - text: .
        - paragraph [ref=f5e463]:
          - strong [ref=f5e464]: "Community / worth checking:"
          - text: Core ML workloads can fail in out-of-process services such as E5 runtime or ANE compiler processes, so an app-name-only scan may miss the root cause. Pull the domain around a bounded run window and inspect all new reports. The exact service names and report schemas are OS-version dependent.
        - paragraph [ref=f5e465]: Jetsam termination is not necessarily a catchable Swift error. Treat a missing done marker, vanished process, and fresh resource-limit report as a correlated failure requiring the crash artifact, not as a timeout to retry blindly.
        - heading "7. Keep Long Measurements Alive" [level=2] [ref=f5e466]
        - paragraph [ref=f5e467]: "For a foreground UIKit harness, disable automatic screen idle while a run is active:"
        - generic [ref=f5e468]:
          - code [ref=f5e470]: "await MainActor.run { UIApplication.shared.isIdleTimerDisabled = true }"
          - button "Copy to clipboard" [ref=f5e471] [cursor=pointer]
        - paragraph [ref=f5e475]: Restore the prior setting after completion.
        - paragraph [ref=f5e476]:
          - strong [ref=f5e477]: "Community / platform hypothesis:"
          - text: a standard app can still be suspended after it is backgrounded or the device locks. A
          - code [ref=f5e478]: devicectl
          - text: launch does not grant indefinite background execution. Keep the measurement app foreground, keep the device in a controlled powered state, and make suspension observable through timestamps and done markers.
        - paragraph [ref=f5e479]: Do not claim an audio, location, or other background mode solely to keep a benchmark alive. Use only a mode that the app genuinely performs and Apple's policy permits. If foreground operation is impossible, design the run into resumable bounded units rather than hiding it behind an unrelated entitlement.
        - paragraph [ref=f5e480]: Thermal state, battery state, charging, screen state, and other active Core ML clients can change latency. Bind those conditions into the experiment protocol when they matter, but keep device identifiers out of public receipts.
        - heading "8. Memory, JIT, AOT, and Jetsam" [level=2] [ref=f5e481]
        - paragraph [ref=f5e482]: "The raw report preserves a useful failure model but overstates it as universal:"
        - list [ref=f5e483]:
          - listitem [ref=f5e484]:
            - strong [ref=f5e485]: "Community reports:"
            - text: some iPhones exhibit a per-process memory ceiling near 6 GB even when total physical memory is larger.
          - listitem [ref=f5e486]:
            - strong [ref=f5e487]: "Community reports:"
            - text: on-device compilation of large Core ML or MPSGraph packages can create transient resident-memory spikes and trigger jetsam or compiler-service failure.
          - listitem [ref=f5e488]:
            - strong [ref=f5e489]: "Community hypothesis:"
            - text: ahead-of-time compiled
            - code [ref=f5e490]: .mlmodelc
            - text: assets can reduce compilation work and permit more file-backed paging than loading an uncompiled package.
          - listitem [ref=f5e491]:
            - strong [ref=f5e492]: "Community reports:"
            - text: the increased-memory-limit entitlement may provide limited or device-dependent relief, with different behavior on iPad.
        - paragraph [ref=f5e493]:
          - text: None of those numbers is portable across devices, OS builds, entitlements, model formats, or Core ML revisions. Measure peak physical footprint in the app, record cold-load and warm-run separately, and pair every unexplained termination with
          - code [ref=f5e494]: systemCrashLogs
          - text: .
        - paragraph [ref=f5e495]: "Prefer a compiled model for device deployment:"
        - generic [ref=f5e496]:
          - code [ref=f5e498]: xcrun coremlcompiler compile \ "/path/to/Model.mlpackage" \ .build/compiled
          - button "Copy to clipboard" [ref=f5e499] [cursor=pointer]
        - paragraph [ref=f5e503]:
          - strong [ref=f5e504]: "Unverified mechanism:"
          - text: memory mapping can move some model storage from dirty resident memory to file-backed pages, but
          - code [ref=f5e505]: .mlmodelc
          - text: is not a promise of zero runtime compilation or safe peak memory. The proof is a target-device cold-load receipt plus crash scan.
        - heading [level=2] [ref=f5e506]:
          - text: 9. Inspect
          - code [ref=f5e507]: MLComputePlan
          - text: Correctly
        - heading "9.1. Current documented Swift surface" [level=3] [ref=f5e508]
        - paragraph [ref=f5e509]: "Context7 verification against Apple Core ML documentation gives these signatures:"
        - generic [ref=f5e510]:
          - code [ref=f5e512]: "static func load( contentsOf url: URL, configuration: MLModelConfiguration ) async throws -> MLComputePlan func deviceUsage( for operation: MLModelStructure.Program.Operation ) -> MLComputePlan.DeviceUsage? func estimatedCost( of operation: MLModelStructure.Program.Operation ) -> MLComputePlan.Cost?"
          - button "Copy to clipboard" [ref=f5e513] [cursor=pointer]
        - paragraph [ref=f5e517]:
          - code [ref=f5e518]: deviceUsage(for:)
          - text: returns
          - code [ref=f5e519]: nil
          - text: when usage cannot be determined. Swift
          - code [ref=f5e520]: DeviceUsage
          - text: exposes
          - code [ref=f5e521]: preferred
          - text: and
          - code [ref=f5e522]: supported
          - text: compute devices.
          - code [ref=f5e523]: estimatedCost(of:)
          - text: exists for ML Program operations and returns an optional cost.
          - code [ref=f5e524]: Cost.weight
          - text: is documented as an estimated workload fraction from
          - code [ref=f5e525]: "0.0"
          - text: to
          - code [ref=f5e526]: "1.0"
          - text: over the total model evaluation.
        - heading "9.2. Minimal on-device walk" [level=3] [ref=f5e527]
        - paragraph [ref=f5e528]:
          - text: Pass the compiled
          - code [ref=f5e529]: .mlmodelc
          - text: "URL and the same configuration used for the model run:"
        - generic [ref=f5e530]:
          - code [ref=f5e532]: "import CoreML import Foundation @available(iOS 17.4, *) func writeComputePlan( compiledModelURL: URL, configuration: MLModelConfiguration ) async throws { let plan = try await MLComputePlan.load( contentsOf: compiledModelURL, configuration: configuration ) guard case let .program(program) = plan.modelStructure, let main = program.functions[\"main\"] else { throw BenchmarkError.expectedMLProgram } for operation in main.block.operations { let usage = plan.deviceUsage(for: operation) let cost = plan.estimatedCost(of: operation) let line = [ operation.operatorName, String(describing: usage?.preferred), String(describing: cost?.weight), ].joined(separator: \"\\t\") FileHandle.standardError.write(Data((line + \"\\n\").utf8)) } }"
          - button "Copy to clipboard" [ref=f5e533] [cursor=pointer]
        - paragraph [ref=f5e537]:
          - text: The
          - code [ref=f5e538]: BenchmarkError
          - text: case is app-owned and must be defined by the harness.
        - heading "9.3. What the values prove" [level=3] [ref=f5e539]
        - list [ref=f5e540]:
          - listitem [ref=f5e541]:
            - code [ref=f5e542]: usage?.preferred
            - text: is anticipated preferred placement for that operation under the supplied configuration. It is not a trace proving where a completed prediction executed.
          - listitem [ref=f5e543]:
            - code [ref=f5e544]: usage?.supported
            - text: can describe available devices where exposed, but support is not selection.
          - listitem [ref=f5e545]:
            - code [ref=f5e546]: cost?.weight
            - text: is an estimate, not milliseconds. Aggregate it within one plan; do not treat it as absolute latency.
          - listitem [ref=f5e547]:
            - strong [ref=f5e548]: "Firsthand implementation evidence:"
            - code [ref=f5e549]: const
            - text: operations returned
            - code [ref=f5e550]: nil
            - text: for both usage and cost in the tested compiled program. Apple documents the optional return and undetermined-usage meaning, not a universal "all const operations are nil" rule. Keep the unwrap for every operation.
          - listitem [ref=f5e551]: The plan is model-, shape-, configuration-, device-, and OS-specific. A simulator or Mac plan does not certify a physical iPhone.
        - paragraph [ref=f5e552]: The raw report called on-device Swift output "irrefutable ground truth." That is too strong. It is more target-specific than an off-device estimate, but it remains a compute plan. Pair it with latency, runtime telemetry, or a trace before claiming actual ANE, GPU, or CPU execution. See the Neural Engine residency guide for that distinction.
