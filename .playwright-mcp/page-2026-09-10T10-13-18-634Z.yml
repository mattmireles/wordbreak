          - text: recipe is not valid there. For live output, use
          - code [ref=f5e405]: devicectl ... --console
          - text: with stderr, an app-owned progress file, or a separately verified device-log tool. Re-check the installed OS before using a remote
          - code [ref=f5e406]: log stream
          - text: recipe.
