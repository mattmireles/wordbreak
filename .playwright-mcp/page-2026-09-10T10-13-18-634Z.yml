          - button "Copy to clipboard" [ref=f5e240] [cursor=pointer]
        - paragraph [ref=f5e244]:
          - strong [ref=f5e245]: "Documented platform constraint, externally synthesized:"
          - text: the app and extensions must carry matching App Group entitlements. Treat App Group staging as a separate security boundary, not an alias for the app container.
