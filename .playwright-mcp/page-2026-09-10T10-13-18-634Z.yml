        - paragraph [ref=f5e357]:
          - strong [ref=f5e358]: "Firsthand implementation evidence:"
          - text: plain Swift
          - code [ref=f5e359]: print(...)
          - text: produced no visible output under
          - code [ref=f5e360]: "--console"
          - text: ; stdout was block-buffered because it was not attached to an interactive terminal. Stderr worked, and a file written under
          - code [ref=f5e361]: Documents
          - text: could be pulled reliably.
        - paragraph [ref=f5e362]: "Use stderr for progress:"
        - generic [ref=f5e363]:
          - code [ref=f5e365]: "import Foundation func emitProgress(_ message: String) { FileHandle.standardError.write(Data((message + \"\\n\").utf8)) }"
          - button "Copy to clipboard" [ref=f5e366] [cursor=pointer]
        - paragraph [ref=f5e370]: "Use a file plus an atomic done marker for the final machine-readable result:"
        - generic [ref=f5e371]:
          - code [ref=f5e373]: "let payload = try JSONEncoder().encode(result) let temporaryURL = resultsURL.appendingPathComponent(\"\\(runID).json.tmp\") let finalURL = resultsURL.appendingPathComponent(\"\\(runID).json\") try payload.write(to: temporaryURL, options: .atomic) try FileManager.default.moveItem(at: temporaryURL, to: finalURL) try Data().write(to: resultsURL.appendingPathComponent(\"\\(runID).done\"))"
          - button "Copy to clipboard" [ref=f5e374] [cursor=pointer]
        - paragraph [ref=f5e378]: "Pull it after the done marker appears:"
        - generic [ref=f5e379]:
          - code [ref=f5e381]: xcrun devicectl device copy from \ --device "<device-id>" \ --domain-type appDataContainer \ --domain-identifier com.example.benchmark \ --source "Documents/results/<run-id>.json" \ --destination "./results/<run-id>.json" \ --json-output pull-result.json
          - button "Copy to clipboard" [ref=f5e382] [cursor=pointer]
        - paragraph [ref=f5e386]: Validate the receipt schema, run ID, configuration identity, model signature, and completion status after transfer.
        - heading "5.2. Unified logging" [level=3] [ref=f5e387]
        - paragraph [ref=f5e388]: "The raw report's OSLog advice remains useful: unified logging survives beyond one stdout pipe, but dynamic fields may be private unless marked public. Never mark private audio, transcripts, credentials, or device identifiers public merely to simplify debugging."
        - paragraph [ref=f5e389]:
